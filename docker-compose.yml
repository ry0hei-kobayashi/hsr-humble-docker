version: '3.2'
services:
  hsrb_humble:
    network_mode: host
    build:
      context: .
      network: host
    container_name: hsrb_humble
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      #- ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      #- ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY}
      - ROS_DOMAIN_ID=20
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///hsr_ros2_ws/cyclonedds_profile.xml
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - NVIDIA_DRIVER_CAPABILITIES=graphics,display,compute,utility

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix 
      - ./additional_packages:/hsr_ros2_ws/src/additional_packages
    security_opt:
      - seccomp:unconfined

    privileged: true
    tty: true
    stdin_open: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    #command: ros2 launch hsrb_gazebo_launch hsrb_apartment_world.launch.py
    command: ros2 launch tmc_wrs_gazebo_launch wrs_no_objects_world.launch.py

